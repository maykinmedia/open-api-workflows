# Workflow to run CodeQL for actions for the open-api-workflows repo itself

name: CodeQL for actions

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 23 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  open-api-workflow-code-analysis:
    uses: maykinmedia/open-api-workflows/.github/workflows/code-analysis.yml@f3918649c67da9bc96991ce64cdbb760b9fed28e  # v6.3.3
    with:
      languages: '["actions"]'

