# Workflow to run CodeQL for actions for the open-api-workflows repo itself

name: CodeQL for actions

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 23 * * 6'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  open-api-workflow-code-analysis:
    uses: maykinmedia/open-api-workflows/.github/workflows/code-analysis.yml@da2c60772d2e3580ccae85352f3d01bfc5ff1229  # pre-v7.0.0
