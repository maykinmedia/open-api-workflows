name: open-api-workflow code-quality
on:
  workflow_call:
    inputs:
      apt-packages:
        required: false
        type: string

      python-version:
        required: true
        type: string
      node-version:
        required: true
        type: string

      postgres-image:
        default: 'postgres:17'
        type: string

      ruff-src-pattern:
        type: string
        default: 'src docs'

      django-settings-module:
        required: true
        type: string
      django-secret-key:
        required: false
        type: string

      db-name:
        required: false
        type: string
        default: 'postgres'
      db-user:
        required: false
        type: string
        default: 'postgres'
      db-password:
        required: false
        type: string
        default: ''

jobs:
  formatting:
    name: Check code formatting
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages: ${{ inputs.apt-packages }}
          python-version: ${{ inputs.python-version }}
          setup-node: false

      - name: Run ruff check
        run: ruff check --output-format=github ${INPUTS_RUFF_SRC_PATTERN}
        env:
          INPUTS_RUFF_SRC_PATTERN: ${{ inputs.ruff-src-pattern }}

      - name: Run ruff format
        run: ruff format --diff ${INPUTS_RUFF_SRC_PATTERN}
        env:
          INPUTS_RUFF_SRC_PATTERN: ${{ inputs.ruff-src-pattern }}

  migrations:
    name: Check for model changes not present in the migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: ${{ inputs.postgres-image }}  # zizmor: ignore[unpinned-images]
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        # Needed because the postgres container does not provide a healthcheck
        options:
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up backend environment
        uses: maykinmedia/setup-django-backend@4a6c5facc65bb1dd510cf06be20871db11a156b3 # v1.4.2
        with:
          apt-packages: ${{ inputs.apt-packages }}
          python-version: ${{ inputs.python-version }}
          setup-node: false

      - name: Check for missing migrations
        run: src/manage.py makemigrations --check --dry-run
        env:
          DJANGO_SETTINGS_MODULE: ${{ inputs.django-settings-module }}
          SITE_DOMAIN: localhost:8000
          SECRET_KEY: ${{ inputs.django-settings-module }}
          DB_USER: ${{ inputs.db-user }}
          DB_NAME: ${{ inputs.db-name }}
          DB_PASSWORD: ${{ inputs.db-password }}
