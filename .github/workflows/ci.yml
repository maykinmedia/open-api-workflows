name: open-api-workflow ci
on:
  workflow_call:
    inputs:
      main-branch:
        required: true
        type: string
        description: 'The name master/main branch'

      python-version:
        type: string
        required: true

      docker-image-name:
        required: true
        type: string
        description: 'Name for the docker image to be build'

      django-settings-module:
        required: true
        type: string

      run-docs:
        default: false
        type: boolean
        description: |
          'Wether to build documentation or not, can be left empty when docs-ssl-conf is given.'

      docs-ssl-conf:
        required: false
        type: string

      apt-packages:
        required: false
        type: string

jobs:
  check-requirements:
    runs-on: ubuntu-latest
    name: Check requirements files
    if: github.ref_type == 'branch'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Get changed requirements files
        id: files
        run: |
          # Determine the base ref or fallback to the last commit
          if [ -n "$GITHUB_BASE_REF" ]; then
            BASE_REF="origin/$GITHUB_BASE_REF"
          else
            BASE_REF="HEAD^"  # Compare with the previous commit on main branch
          fi

          git fetch --all

          # Get the list of files that were changed between the base branch and the current commit
          CHANGED_FILES=$(git diff --name-only $BASE_REF...HEAD)
          if [[ -n "$CHANGED_FILES" ]]; then
            MODIFIED_FILES=$(echo "$CHANGED_FILES" | tr '\n' ' ')  # Space-separated list
            echo "modified_files=$MODIFIED_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "modified_files=" >> "$GITHUB_OUTPUT"
          fi
          if echo "$CHANGED_FILES" | grep -q "^requirements/.*\.txt$"; then
            echo "Files were changed!"
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "No changes detected"
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check requirements
        if: >
          contains(steps.files.outputs.modified_files, 'requirements/base.txt') &&
          (
            ! contains(steps.files.outputs.modified_files, 'requirements/ci.txt') ||
            ! contains(steps.files.outputs.modified_files, 'requirements/dev.txt')
          )
        run: |
          echo "'requirements/base.txt' was changed, but 'requirements/ci.txt' or 'requirements/dev.txt' were not."
          echo "Please update the requirements using ./bin/compile_dependencies.sh"
          exit 1

  docs:
    runs-on: ubuntu-latest
    name: Documentation build
    if: ${{ inputs.run-docs || inputs.docs-ssl-conf }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install OS dependencies
        if: ${{ inputs.apt-packages }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes ${INPUTS_APT_PACKAGES}
        shell: bash
        env:
          INPUTS_APT_PACKAGES: ${{ inputs.apt-packages }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: 'pip'
          cache-dependency-path: 'requirements/*.txt'
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system --requirement requirements/ci.txt
      - name: Build and test docs
        env:
          OPENSSL_CONF: ${{ inputs.docs-ssl-conf }}
          DJANGO_SETTINGS_MODULE: ${{ inputs.django-settings-module }}
          SITE_DOMAIN: localhost:8000
          FORCE_COLOR: "1"
        run: |
          make SPHINXOPTS="-W" html
          make linkcheck
        working-directory: docs

  docker-build:
    runs-on: ubuntu-latest
    name: Docker image build

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Determine tag/commit hash
        id: vars
        uses: maykinmedia/open-api-workflows/actions/extract-version@0a5525c13f8eea10be40c8eaee5e535ea3a10721  # v6.4.1
      - name: Build the Docker image
        run: |
          docker build \
            --tag ${INPUTS_DOCKER_IMAGE_NAME}:${STEPS_VARS_OUTPUTS_VERSION} \
            --build-arg COMMIT_HASH=${STEPS_VARS_OUTPUTS_GIT_HASH} \
            --build-arg RELEASE=${STEPS_VARS_OUTPUTS_VERSION} \
            .
        env:
          INPUTS_DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
          STEPS_VARS_OUTPUTS_VERSION: ${{ steps.vars.outputs.version }}
          STEPS_VARS_OUTPUTS_GIT_HASH: ${{ steps.vars.outputs.git_hash }}
      - run: docker image save -o image.tar ${INPUTS_DOCKER_IMAGE_NAME}:${STEPS_VARS_OUTPUTS_VERSION}
        env:
          INPUTS_DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
          STEPS_VARS_OUTPUTS_VERSION: ${{ steps.vars.outputs.version }}
      - name: Store image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  image_scan:
    runs-on: ubuntu-latest
    name: Scan docker image
    needs:
      - docker-build

    steps:
      # So the scanner gets commit meta-information
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download built image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docker-image

      - name: Scan image with Trivy
        # Pinned to sha for v0.69.3
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          input: ${{ github.workspace }}/image.tar  # from download-artifact
          format: 'sarif'
          output: 'trivy-results-docker.sarif'
          ignore-unfixed: true

      - name: Upload results to GH Security tab
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: 'trivy-results-docker.sarif'
